<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI Chat — به‌زودی</title>
<style>
:root {
  --bg: #000;
  --bg-2: #0a0a0a;
  --bg-3: #141414;
  --border: #1f1f1f;
  --text: #fff;
  --text-dim: #a0a0a0;
  --text-mute: #666;
  --accent: #4d6bfe;
  --accent-2: #5b78ff;
  --accent-soft: rgba(77, 107, 254, 0.12);
  --success: #3ddc97;
}

* {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Vazirmatn', 'Inter', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  user-select: none;
}

/* ============ پس‌زمینه ============ */
.bg {
  position: fixed; inset: 0; z-index: -3;
  background:
    radial-gradient(circle at 15% 25%, rgba(77,107,254,0.18) 0%, transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(91,120,255,0.14) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, #0a0a1a 0%, #000 100%);
}

/* گوی‌های نورانی شناور */
.orb {
  position: fixed; border-radius: 50%;
  filter: blur(90px); opacity: 0.45; z-index: -2;
  animation: float 14s ease-in-out infinite;
}
.orb1 { width: 380px; height: 380px; background: #4d6bfe; top: -120px; right: -120px; }
.orb2 { width: 320px; height: 320px; background: #5b78ff; bottom: -120px; left: -100px; animation-delay: -5s; }
.orb3 { width: 260px; height: 260px; background: #7c3aed; top: 45%; left: 40%; animation-delay: -9s; opacity: 0.3; }

@keyframes float {
  0%, 100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(40px,-30px) scale(1.08); }
  66% { transform: translate(-30px,40px) scale(0.95); }
}

/* شبکه نقطه‌ای */
.grid {
  position: fixed; inset: 0; z-index: -1;
  background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 30px 30px;
  mask-image: radial-gradient(circle at center, black 15%, transparent 70%);
  -webkit-mask-image: radial-gradient(circle at center, black 15%, transparent 70%);
}

/* ============ کانتینر ============ */
.container {
  height: 100vh; height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}

.card {
  position: relative;
  max-width: 460px; width: 100%;
  padding: 52px 32px 44px;
  text-align: center;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 30px;
  box-shadow:
    0 30px 70px rgba(0,0,0,0.7),
    inset 0 1px 0 rgba(255,255,255,0.08);
  animation: fadeUp 0.9s cubic-bezier(.2,.8,.2,1);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(40px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* حاشیه نورانی چرخان */
.card::before {
  content: '';
  position: absolute; inset: -1px;
  border-radius: 30px;
  padding: 1px;
  background: conic-gradient(from 0deg, transparent 0%, #4d6bfe 20%, #5b78ff 40%, transparent 60%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  animation: rotateBorder 5s linear infinite;
  pointer-events: none;
  opacity: 0.7;
}

@keyframes rotateBorder {
  to { transform: rotate(360deg); }
}

/* ============ لوگو ============ */
.logo-wrap {
  position: relative;
  width: 110px; height: 110px;
  margin: 0 auto 26px;
  display: flex; align-items: center; justify-content: center;
}

.logo-ring {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 1.5px solid rgba(77,107,254,0.35);
  animation: pulseRing 2.6s ease-out infinite;
}
.logo-ring:nth-child(2) { animation-delay: 1.3s; }

@keyframes pulseRing {
  0% { transform: scale(0.7); opacity: 0.7; }
  100% { transform: scale(1.35); opacity: 0; }
}

.logo-core {
  position: relative;
  width: 82px; height: 82px;
  border-radius: 24px;
  background: linear-gradient(135deg, rgba(77,107,254,0.16), rgba(91,120,255,0.05));
  border: 1px solid rgba(77,107,254,0.3);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  box-shadow:
    0 0 40px rgba(77,107,254,0.35),
    inset 0 0 20px rgba(77,107,254,0.15);
  animation: logoFloat 3.2s ease-in-out infinite;
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

.logo-core svg {
  width: 44px; height: 44px;
  filter: drop-shadow(0 0 8px rgba(77,107,254,0.8));
}

/* جرقه‌های دور لوگو */
.spark {
  position: absolute;
  width: 4px; height: 4px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent);
  animation: sparkle 2.4s ease-in-out infinite;
}
.spark:nth-child(4) { top: 12%; right: 12%; animation-delay: 0s; }
.spark:nth-child(5) { top: 15%; left: 15%; animation-delay: .6s; }
.spark:nth-child(6) { bottom: 12%; right: 18%; animation-delay: 1.2s; }
.spark:nth-child(7) { bottom: 15%; left: 12%; animation-delay: 1.8s; }

@keyframes sparkle {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50% { opacity: 1; transform: scale(1.3); }
}

/* ============ بج ============ */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 16px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent-2);
  border: 1px solid rgba(77,107,254,0.35);
  border-radius: 999px;
  background: rgba(77,107,254,0.08);
  margin-bottom: 22px;
  letter-spacing: 0.4px;
}

.badge .dot {
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent);
  animation: blink 1.4s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ============ تیتر ============ */
h1 {
  font-size: clamp(1.7rem, 5.5vw, 2.3rem);
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: -0.5px;
  margin-bottom: 14px;
  background: linear-gradient(135deg, #fff 0%, #a9baff 55%, #4d6bfe 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.sub {
  color: var(--text-dim);
  font-size: clamp(13px, 2vw, 14.5px);
  line-height: 1.9;
  max-width: 340px;
  margin: 0 auto 34px;
}

/* ============ شمارش معکوس ============ */
.countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 34px;
}

.cd-box {
  position: relative;
  padding: 16px 6px 12px;
  border-radius: 16px;
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(255,255,255,0.07);
  transition: all 0.3s cubic-bezier(.2,.8,.2,1);
  overflow: hidden;
}

.cd-box::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(77,107,254,0.6), transparent);
  opacity: 0;
  transition: opacity .3s;
}

.cd-box:hover {
  transform: translateY(-4px);
  border-color: rgba(77,107,254,0.4);
  background: rgba(77,107,254,0.05);
}
.cd-box:hover::after { opacity: 1; }

.cd-num {
  font-size: clamp(22px, 6vw, 30px);
  font-weight: 800;
  color: #fff;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  text-shadow: 0 0 24px rgba(77,107,254,0.4);
}

.cd-label {
  font-size: 10.5px;
  color: var(--text-mute);
  margin-top: 8px;
  letter-spacing: 0.5px;
  font-weight: 500;
}

/* ============ نوار پیشرفت ============ */
.progress-wrap {
  margin-bottom: 30px;
}

.progress-track {
  height: 5px;
  background: rgba(255,255,255,0.05);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #4d6bfe, #5b78ff, #a9baff, #4d6bfe);
  background-size: 200% 100%;
  border-radius: 999px;
  box-shadow: 0 0 12px rgba(77,107,254,0.7);
  animation: shimmer 2.4s linear infinite;
  transition: width 1s ease-out;
}

@keyframes shimmer {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-mute);
  margin-top: 10px;
  font-weight: 500;
}

.progress-label .percent {
  color: var(--accent-2);
  font-weight: 700;
}

/* ============ شبکه اجتماعی ============ */
.socials {
  display: flex;
  justify-content: center;
  gap: 12px;
}

.socials a {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border-radius: 13px;
  color: var(--text-dim);
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  transition: all 0.25s cubic-bezier(.2,.8,.2,1);
  text-decoration: none;
}

.socials a:active {
  transform: scale(0.9);
}

.socials a:hover {
  color: #fff;
  transform: translateY(-4px);
  border-color: var(--accent);
  background: rgba(77,107,254,0.12);
  box-shadow: 0 10px 24px rgba(77,107,254,0.35);
}

.socials svg { width: 19px; height: 19px; }

/* ============ ذرات شناور ============ */
.particles {
  position: fixed; inset: 0;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 2px; height: 2px;
  background: rgba(77,107,254,0.7);
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(77,107,254,0.9);
  animation: rise linear infinite;
}

@keyframes rise {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* ============ ریسپانسیو ============ */
@media (max-width: 420px) {
  .card { padding: 42px 22px 36px; border-radius: 24px; }
  .logo-wrap { width: 96px; height: 96px; margin-bottom: 20px; }
  .logo-core { width: 72px; height: 72px; border-radius: 20px; }
  .logo-core svg { width: 38px; height: 38px; }
  .cd-box { padding: 13px 4px 10px; border-radius: 13px; }
  .cd-label { font-size: 9.5px; }
}
</style>
</head>
<body>

<!-- پس‌زمینه -->
<div class="bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="grid"></div>
<div class="particles" id="particles"></div>

<div class="container">
  <div class="card">

    <!-- لوگو -->
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo-ring"></div>
      <div class="logo-core">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 L14 9 L21 11 L14 13 L12 20 L10 13 L3 11 L10 9 Z"/>
        </svg>
      </div>
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
    </div>

    <!-- بج -->
    <div class="badge">
      <span class="dot"></span>
      در حال به‌روزرسانی
    </div>

    <!-- تیتر و متن -->
    <h1>نسخه‌ی جدید<br>در راهه</h1>
    <p class="sub">
      داریم AI Chat رو با قابلیت‌های تازه و تجربه‌ای کاملاً متفاوت آماده می‌کنیم.<br>
      به‌زودی برمی‌گردیم ✨
    </p>

    <!-- شمارش معکوس -->
    <div class="countdown">
      <div class="cd-box">
        <div class="cd-num" id="days">02</div>
        <div class="cd-label">روز</div>
      </div>
      <div class="cd-box">
        <div class="cd-num" id="hours">04</div>
        <div class="cd-label">ساعت</div>
      </div>
      <div class="cd-box">
        <div class="cd-num" id="minutes">00</div>
        <div class="cd-label">دقیقه</div>
      </div>
      <div class="cd-box">
        <div class="cd-num" id="seconds">00</div>
        <div class="cd-label">ثانیه</div>
      </div>
    </div>

    <!-- نوار پیشرفت -->
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-label">
        <span>در حال آماده‌سازی...</span>
        <span class="percent" id="progressPercent">0%</span>
      </div>
    </div>

    <!-- شبکه‌های اجتماعی -->
    <div class="socials">
      <a href="https://t.me/AiNews" target="_blank" aria-label="Telegram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 L11 13"/><path d="M22 2 L15 22 L11 13 L2 9 Z"/>
        </svg>
      </a>
      <a href="#" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
        </svg>
      </a>
      <a href="#" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.8 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.6-1.3-1.6-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 016 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.9 1.2 3.1 0 4.5-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.8-5.8 7.8-10.9C23.5 5.7 18.3.5 12 .5z"/>
        </svg>
      </a>
    </div>

  </div>
</div>

<script>
// ================== تنظیمات شمارش معکوس ==================
// مدت زمان باقی‌مانده: ۲ روز + ۴ ساعت
const COUNTDOWN_MS = (2 * 24 * 60 * 60 * 1000) + (4 * 60 * 60 * 1000);

// زمان پایان (از لحظه‌ی باز شدن صفحه محاسبه می‌شه و توی localStorage ذخیره می‌شه)
const STORAGE_KEY = 'ai_update_target';
let targetTime = parseInt(localStorage.getItem(STORAGE_KEY) || '0');

if (!targetTime || targetTime < Date.now()) {
  targetTime = Date.now() + COUNTDOWN_MS;
  localStorage.setItem(STORAGE_KEY, targetTime);
}

const startTime = targetTime - COUNTDOWN_MS;

// ================== به‌روزرسانی شمارش معکوس ==================
function pad(n) { return String(n).padStart(2, '0'); }

function updateCountdown() {
  const now = Date.now();
  const diff = targetTime - now;

  if (diff <= 0) {
    document.getElementById('days').textContent = '00';
    document.getElementById('hours').textContent = '00';
    document.getElementById('minutes').textContent = '00';
    document.getElementById('seconds').textContent = '00';
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100%';
    return;
  }

  const days = Math.floor(diff / 86400000);
  const hours = Math.floor(diff / 3600000) % 24;
  const minutes = Math.floor(diff / 60000) % 60;
  const seconds = Math.floor(diff / 1000) % 60;

  document.getElementById('days').textContent = pad(days);
  document.getElementById('hours').textContent = pad(hours);
  document.getElementById('minutes').textContent = pad(minutes);
  document.getElementById('seconds').textContent = pad(seconds);

  // نوار پیشرفت: از ۰ تا ۱۰۰
  const elapsed = now - startTime;
  const percent = Math.min(100, Math.max(0, (elapsed / COUNTDOWN_MS) * 100));
  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('progressPercent').textContent = Math.floor(percent) + '%';
}

updateCountdown();
setInterval(updateCountdown, 1000);

// ================== ذرات شناور ==================
(function createParticles() {
  const container = document.getElementById('particles');
  const count = 22;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 10) + 's';
    p.style.animationDelay = (Math.random() * 12) + 's';
    p.style.opacity = 0.3 + Math.random() * 0.5;
    const size = 1 + Math.random() * 2;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    container.appendChild(p);
  }
})();

// ================== پارالاکس گوی‌ها با موس/لمس ==================
document.addEventListener('mousemove', (e) => {
  const x = (e.clientX / window.innerWidth - 0.5) * 20;
  const y = (e.clientY / window.innerHeight - 0.5) * 20;
  document.querySelectorAll('.orb').forEach((orb, i) => {
    const f = (i + 1) * 0.5;
    orb.style.transform = `translate(${x * f}px, ${y * f}px)`;
  });
});

// پشتیبانی از لمس روی موبایل
document.addEventListener('touchmove', (e) => {
  const touch = e.touches[0];
  if (!touch) return;
  const x = (touch.clientX / window.innerWidth - 0.5) * 16;
  const y = (touch.clientY / window.innerHeight - 0.5) * 16;
  document.querySelectorAll('.orb').forEach((orb, i) => {
    const f = (i + 1) * 0.5;
    orb.style.transform = `translate(${x * f}px, ${y * f}px)`;
  });
}, { passive: true });
</script>
