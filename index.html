<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Chat</title>
<style>
/* ============ Themes ============ */
:root, [data-theme="dark"] {
    --bg: #0d0d0d;
    --bg-2: #161616;
    --bg-3: #1f1f1f;
    --bg-4: #2a2a2a;
    --border: #2a2a2a;
    --border-2: #333;
    --text: #ececec;
    --text-dim: #8e8e8e;
    --text-mute: #5a5a5a;
    --accent: #4d6bfe;
    --accent-2: #5b78ff;
    --accent-glow: rgba(77, 107, 254, 0.25);
    --danger: #ff5470;
    --success: #3ddc97;
    --user-bubble: #262626;
    --code-bg: #0d1117;
    --code-header: #161b22;
    --code-text: #c9d1d9;
    --code-border: #21262d;
}

[data-theme="light"] {
    --bg: #ffffff;
    --bg-2: #f7f7f8;
    --bg-3: #ececf1;
    --bg-4: #e0e0e5;
    --border: #e0e0e5;
    --border-2: #d0d0d5;
    --text: #0d0d0d;
    --text-dim: #666;
    --text-mute: #999;
    --accent: #4d6bfe;
    --accent-2: #5b78ff;
    --accent-glow: rgba(77, 107, 254, 0.2);
    --danger: #e74c3c;
    --success: #27ae60;
    --user-bubble: #f0f0f5;
    --code-bg: #f6f8fa;
    --code-header: #eaeef2;
    --code-text: #24292f;
    --code-border: #d0d7de;
}

[data-theme="blue"] {
    --bg: #0a1628;
    --bg-2: #0f1e35;
    --bg-3: #142845;
    --bg-4: #1a3255;
    --border: #1a3255;
    --border-2: #264a7a;
    --text: #e6f0ff;
    --text-dim: #8ab4f8;
    --text-mute: #5a7ab0;
    --accent: #4d8cff;
    --accent-2: #6ba0ff;
    --accent-glow: rgba(77, 140, 255, 0.3);
    --danger: #ff6b8a;
    --success: #4dff9f;
    --user-bubble: #1a2d4d;
    --code-bg: #061020;
    --code-header: #0d1e3a;
    --code-text: #b8d4ff;
    --code-border: #1a3255;
}

[data-theme="green"] {
    --bg: #0a1a0f;
    --bg-2: #0f2418;
    --bg-3: #142e1f;
    --bg-4: #1a3828;
    --border: #1a3828;
    --border-2: #26503a;
    --text: #e6ffe6;
    --text-dim: #8fd8a0;
    --text-mute: #5a9a6a;
    --accent: #4ddc7d;
    --accent-2: #6be89a;
    --accent-glow: rgba(77, 220, 125, 0.3);
    --danger: #ff6b8a;
    --success: #4dff9f;
    --user-bubble: #1a3828;
    --code-bg: #051208;
    --code-header: #0a1f10;
    --code-text: #b8ffc9;
    --code-border: #1a3828;
}

* {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}

.msg-bubble, .code-content, .interest-chip, .edit-textarea, #input {
    -webkit-user-select: text;
    user-select: text;
}

html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Vazirmatn', 'Inter', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
    transition: background 0.3s, color 0.3s;
}

html[dir="ltr"] { direction: ltr; }
html[dir="rtl"] { direction: rtl; }

.app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
}

/* ===== Header ===== */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 20;
    flex-shrink: 0;
    min-height: 54px;
    transition: background 0.3s, border-color 0.3s;
}

.header-left, .header-right {
    display: flex;
    align-items: center;
    gap: 6px;
}

.header-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
}

.header-logo {
    width: 26px; height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
}

.icon-btn {
    width: 36px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    position: relative;
}

.icon-btn:active { background: var(--bg-3); transform: scale(0.92); }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 8px;
    background: var(--bg-3);
    color: var(--text-dim);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s;
}

.badge.warn {
    background: rgba(255, 84, 112, 0.12);
    color: var(--danger);
    border-color: rgba(255, 84, 112, 0.25);
}

.badge svg { width: 12px; height: 12px; }

/* ===== Overlay ===== */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 90;
}

.overlay.show { opacity: 1; pointer-events: auto; }

/* ===== Sidebar ===== */
.sidebar {
    position: fixed;
    top: 0;
    right: 0;
    width: 82%;
    max-width: 340px;
    height: 100%;
    background: var(--bg-2);
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1), background 0.3s;
    z-index: 100;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

html[dir="ltr"] .sidebar {
    right: auto;
    left: 0;
    border-left: none;
    border-right: 1px solid var(--border);
    transform: translateX(-100%);
}

.sidebar.open { transform: translateX(0) !important; }

.sidebar-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}

.sidebar-title { font-size: 14px; font-weight: 600; color: var(--text); }

.new-chat-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px;
    padding: 11px 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
}

.new-chat-btn:active { transform: scale(0.97); background: var(--accent-2); }
.new-chat-btn svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 2.2; fill: none; stroke-linecap: round; }

.chats-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px 20px;
}

.chats-list::-webkit-scrollbar { width: 3px; }
.chats-list::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

.chat-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.12s;
    margin-bottom: 2px;
    position: relative;
}

.chat-item:active, .chat-item.active { background: var(--bg-3); }

.chat-item-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--bg-3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--text-dim);
}

.chat-item.active .chat-item-icon { background: var(--accent); color: #fff; }
.chat-item-icon svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ✅ وقتی چت پین شده، ستاره رو پر کن */
.chat-item.pinned .chat-item-icon svg {
    fill: #ffb648;
    stroke: #ffb648;
    filter: drop-shadow(0 0 4px rgba(255, 182, 72, 0.5));
}

/* ✅ وقتی چت پین شده و active هست */
.chat-item.pinned.active .chat-item-icon svg {
    fill: #ffd700;
    stroke: #ffd700;
}

/* ✅ اگه میخوای کل آیتم پین‌شده یه کم متفاوت باشه */
.chat-item.pinned {
    background: rgba(255, 182, 72, 0.05);
}

.chat-item.pinned.active {
    background: rgba(255, 182, 72, 0.12);
}

.chat-item-info { flex: 1; min-width: 0; }

.chat-item-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
}

.chat-item-meta { font-size: 11px; color: var(--text-mute); }

.chat-item-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
.chat-item:hover .chat-item-actions, .chat-item.active .chat-item-actions { opacity: 1; }

.chat-action-btn {
    width: 28px; height: 28px;
    border: none;
    background: transparent;
    border-radius: 7px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.12s;
}

.chat-action-btn:active { background: var(--bg-4); color: var(--text); }
.chat-action-btn.danger:active { background: rgba(255, 84, 112, 0.15); color: var(--danger); }
.chat-action-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.no-chats {
    text-align: center;
    color: var(--text-mute);
    font-size: 13px;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.no-chats svg { width: 40px; height: 40px; stroke: var(--text-mute); stroke-width: 1.5; fill: none; opacity: 0.6; }

/* ===== Chat area ===== */
.chat-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 0;
    scroll-behavior: smooth;
    display: flex;
    flex-direction: column;
}

.chat-area::-webkit-scrollbar { width: 3px; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

/* ===== Welcome ===== */
.welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 24px 24px;
    animation: fadeIn 0.4s;
    margin: auto 0;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.welcome-logo {
    width: 64px; height: 64px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 0 40px var(--accent-glow);
}

.welcome-logo svg { width: 32px; height: 32px; stroke: #fff; stroke-width: 1.6; fill: none; }

.welcome h1 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.welcome p { color: var(--text-dim); font-size: 13px; max-width: 280px; line-height: 1.7; }

.suggestions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 28px;
    width: 100%;
    max-width: 340px;
}

.suggestion {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 13px;
    text-align: start;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
}

.suggestion:active { transform: scale(0.98); background: var(--bg-3); border-color: var(--accent); }
.suggestion svg { width: 16px; height: 16px; stroke: var(--accent); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* ===== Message ===== */
.message {
    display: flex;
    padding: 0 16px;
    margin-bottom: 18px;
    animation: msgIn 0.3s ease-out;
    max-width: 100%;
    position: relative;
}

@keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.user { justify-content: flex-start; flex-direction: row; }
.message.ai { justify-content: flex-end; flex-direction: row; }

.msg-content { display: flex; flex-direction: column; max-width: 88%; }
.message.user .msg-content { align-items: flex-start; }
.message.ai .msg-content { align-items: flex-end; }

.msg-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
}

.message.ai .msg-header { flex-direction: row-reverse; }

.msg-bubble {
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.75;
    word-wrap: break-word;
    overflow-wrap: break-word;
    max-width: 100%;
    position: relative;
}

.msg-avatar {
    width: 22px; height: 22px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
}

.msg-avatar.ai { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.msg-avatar.ai svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 2; fill: none; }

.msg-avatar.user {
    background: var(--bg-3);
    color: var(--accent);
    font-size: 10px;
    font-weight: 700;
}

.msg-avatar.user img { width: 100%; height: 100%; object-fit: cover; }

.code-block {
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 8px 0;
    overflow: hidden;
    direction: ltr;
    text-align: left;
    max-width: 100%;
}

.message.user .msg-bubble {
    background: var(--user-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 5px;
    color: var(--text);
}

html[dir="ltr"] .message.user .msg-bubble { border-top-left-radius: 16px; border-top-right-radius: 5px; }

.message.user .msg-bubble:active { opacity: 0.85; }

.message.ai .msg-bubble {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-top-right-radius: 5px;
    color: var(--text);
}

html[dir="ltr"] .message.ai .msg-bubble { border-top-right-radius: 16px; border-top-left-radius: 5px; }

/* ===== Copy button for AI messages ===== */
.msg-copy-btn {
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
    align-self: flex-start;
}

.message.ai .msg-copy-btn { align-self: flex-end; }
.msg-copy-btn:active { background: var(--bg-3); color: var(--text); transform: scale(0.96); }
.msg-copy-btn svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.msg-copy-btn.copied { color: var(--success); border-color: rgba(61, 220, 151, 0.4); }

/* ===== Markdown ===== */
.msg-bubble strong { font-weight: 700; color: var(--text); filter: brightness(1.1); }
.msg-bubble em { font-style: italic; color: var(--accent-2); }
.msg-bubble del { text-decoration: line-through; opacity: 0.5; }

.msg-bubble code {
    background: #1e1e2e;
    padding: 2px 6px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', Consolas, monospace;
    font-size: 13px;
    direction: ltr;
    display: inline-block;
    color: #ff9d7c;
    border: 1px solid #2a2a3e;
    font-weight: 500;
    unicode-bidi: embed;
}

[data-theme="light"] .msg-bubble code { background: #f6f8fa; color: #cf222e; border-color: #d0d7de; }
[data-theme="blue"] .msg-bubble code { background: #061020; color: #7ab8ff; border-color: #1a3255; }
[data-theme="green"] .msg-bubble code { background: #051208; color: #7affaa; border-color: #1a3828; }

/* ===== Code Block ===== */
.code-block {
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 8px 0;
    overflow: hidden;
    direction: ltr;
    text-align: left;
    max-width: 100%;
}

.code-header {
    background: var(--bg-3);
    padding: 6px 12px;
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-weight: 600;
}

.code-header .lang {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 500;
    text-transform: lowercase;
}

.copy-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.15s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: 500;
}

.copy-btn:active { background: var(--bg-4); color: var(--text); transform: scale(0.96); }
.copy-btn.copied { color: var(--success); border-color: rgba(61, 220, 151, 0.3); }
.copy-btn svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.code-content {
    padding: 10px 14px;
    overflow-x: auto;
    overflow-y: hidden;
    font-family: 'JetBrains Mono', 'Courier New', Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    color: #d4d4d4;
    white-space: pre;
    max-width: 100%;
    -webkit-overflow-scrolling: touch;   /* ← اسکرول نرم روی iOS */
}

.code-content::-webkit-scrollbar { height: 6px; }
.code-content::-webkit-scrollbar-track { background: var(--code-bg); }
.code-content::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

.quote {
    border-inline-start: 3px solid var(--accent);
    border-inline-end: none;
    padding: 8px 14px;
    margin: 10px 0;
    background: rgba(77, 107, 254, 0.06);
    border-radius: 6px;
    font-size: 14px;
    color: var(--text-dim);
}

.msg-bubble ul, .msg-bubble ol { margin: 10px 0; padding-inline-start: 24px; }
.msg-bubble li { margin: 6px 0; line-height: 1.7; }

/* ===== Table ===== */
.table-wrapper {
    overflow-x: auto;
    margin: 12px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    -webkit-overflow-scrolling: touch;
    background: var(--bg-2);
}

.table-wrapper::-webkit-scrollbar { height: 6px; }
.table-wrapper::-webkit-scrollbar-track { background: var(--bg-3); }
.table-wrapper::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

.msg-bubble table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    line-height: 1.6;
    direction: rtl;
    text-align: right;
    min-width: 300px;
}

.msg-bubble th {
    background: var(--bg-3);
    color: var(--text);
    font-weight: 700;
    padding: 10px 14px;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    font-size: 12.5px;
    text-align: right;
}

.msg-bubble td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    text-align: right;
}

.msg-bubble tr:last-child td {
    border-bottom: none;
}

.msg-bubble tr:hover td {
    background: rgba(77, 107, 254, 0.04);
}

.msg-bubble tr:nth-child(even) td {
    background: rgba(255, 255, 255, 0.015);
}

.msg-bubble tr:nth-child(even):hover td {
    background: rgba(77, 107, 254, 0.06);
}

.msg-bubble a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(77, 107, 254, 0.3);
}

.msg-bubble h1, .msg-bubble h2, .msg-bubble h3 {
    color: var(--text);
    margin: 12px 0 8px;
    font-weight: 700;
    line-height: 1.4;
}

.msg-bubble h1 { font-size: 18px; }
.msg-bubble h2 { font-size: 16px; }
.msg-bubble h3 { font-size: 15px; }

/* ===== Typing ===== */
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: typing 1.4s ease-in-out infinite;
    opacity: 0.6;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
}

/* ===== Input area ===== */
.input-area {
    padding: 10px 14px 16px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
    transition: background 0.3s;
}

.input-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 6px 6px 6px 14px;
    transition: border-color 0.2s, background 0.3s;
}

html[dir="ltr"] .input-wrapper { padding: 6px 14px 6px 6px; }
.input-wrapper:focus-within { border-color: var(--accent); }

#input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    padding: 8px 0;
    -webkit-user-select: text;
    user-select: text;
}

#input::placeholder { color: var(--text-mute); }

.send-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
}

.send-btn:active { transform: scale(0.9); }
.send-btn:disabled { background: var(--bg-4); color: var(--text-mute); cursor: not-allowed; }
.send-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
html[dir="ltr"] .send-btn svg { transform: scaleX(-1); }
.send-btn.loading svg { display: none; }

.spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Profile ===== */
.profile-avatar-wrap { display: flex; flex-direction: column; align-items: center; padding: 30px 20px 24px; }

.profile-avatar {
    width: 88px; height: 88px;
    border-radius: 24px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: 0 0 30px var(--accent-glow);
}

.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-name { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
.profile-sub { font-size: 12px; color: var(--text-dim); }
.profile-id { font-size: 11px; color: var(--text-mute); margin-top: 4px; direction: ltr; font-family: 'JetBrains Mono', monospace; }

.stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 16px;
    margin-bottom: 16px;
}

.stat-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
}

.stat-value { font-size: 22px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.stat-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* ===== Link buttons ===== */
.links-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 16px;
    margin-bottom: 16px;
}

.link-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 18px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--text);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s;
    font-family: inherit;
    cursor: pointer;
}

.link-btn:active { transform: scale(0.97); background: var(--bg-3); border-color: var(--accent); }

.link-btn-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(77, 107, 254, 0.12);
    color: var(--accent);
}

.link-btn.telegram .link-btn-icon { background: rgba(41, 168, 224, 0.12); color: #29a8e0; }
.link-btn-icon svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.link-btn span { color: var(--text-dim); font-size: 11px; font-weight: 500; }

/* ===== Sections ===== */
.section { padding: 0 16px; margin-bottom: 16px; }

.section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 10px;
}

.section-title svg { width: 15px; height: 15px; stroke: var(--accent); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ===== Setting rows ===== */
.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
}

.setting-row:active { transform: scale(0.98); background: var(--bg-3); }

.setting-row-left {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
}

.setting-row-left svg { width: 18px; height: 18px; stroke: var(--accent); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.setting-row-right { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; }

.theme-options, .lang-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.theme-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
}

.theme-dot.active { border-color: var(--accent); transform: scale(1.1); box-shadow: 0 0 0 3px var(--accent-glow); }
.theme-dot:active { transform: scale(0.95); }

.theme-dot[data-color="dark"] { background: linear-gradient(135deg, #0d0d0d, #2a2a2a); }
.theme-dot[data-color="light"] { background: linear-gradient(135deg, #ffffff, #e0e0e5); }
.theme-dot[data-color="blue"] { background: linear-gradient(135deg, #0a1628, #1a3255); }
.theme-dot[data-color="green"] { background: linear-gradient(135deg, #0a1a0f, #1a3828); }

.lang-pill {
    padding: 6px 14px;
    border-radius: 10px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
}

.lang-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.lang-pill:active { transform: scale(0.95); }

/* ===== Interests ===== */
.interests { display: flex; flex-wrap: wrap; gap: 6px; min-height: 32px; }

.interest-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px;
    color: var(--text);
    animation: fadeIn 0.2s;
}

.interest-chip .x { color: var(--danger); cursor: pointer; font-size: 14px; font-weight: 700; line-height: 1; padding: 0 2px; }
.empty-interests { color: var(--text-mute); font-size: 12px; padding: 8px 0; }

.interest-input-row { display: flex; gap: 8px; margin-top: 10px; }

.interest-input {
    flex: 1;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
    -webkit-user-select: text;
    user-select: text;
}

.interest-input:focus { border-color: var(--accent); }

.interest-add {
    width: 42px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}

.interest-add:active { transform: scale(0.95); }
.interest-add svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 2.2; fill: none; stroke-linecap: round; }

/* ===== Toast ===== */
.toast {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: var(--bg-4);
    border: 1px solid var(--border-2);
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 13px;
    color: var(--text);
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    max-width: 90%;
    text-align: center;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: rgba(61, 220, 151, 0.4); color: var(--success); }
.toast.danger { border-color: rgba(255, 84, 112, 0.4); color: var(--danger); }

/* ===== Modals ===== */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    animation: fadeIn 0.2s;
}

.modal.show { display: flex; }

.modal-box {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    animation: modalIn 0.3s cubic-bezier(0.32, 0.72, 0, 1);
}

@keyframes modalIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

.modal-icon {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: rgba(255, 84, 112, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
}

.modal-icon svg { width: 28px; height: 28px; stroke: var(--danger); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.modal-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.modal-text { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 16px; }
.modal-timer { font-size: 28px; font-weight: 700; color: var(--accent); margin: 14px 0; font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', monospace; }

.modal-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
}

.modal-btn:active { transform: scale(0.97); background: var(--accent-2); }

/* ===== Action Menu ===== */
.msg-action-menu {
    position: fixed;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    display: none;
    flex-direction: column;
    gap: 2px;
    z-index: 500;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    min-width: 140px;
    animation: menuIn 0.15s ease-out;
}

.msg-action-menu.show { display: flex; }

@keyframes menuIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

.msg-action-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.12s;
    text-align: start;
    font-weight: 500;
}

.msg-action-item:active { background: var(--bg-4); }
.msg-action-item svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.msg-action-item.danger { color: var(--danger); }

/* ===== Edit Modal ===== */
.edit-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 600;
    padding: 20px;
    animation: fadeIn 0.2s;
}

.edit-modal.show { display: flex; }

.edit-box {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    max-width: 420px;
    width: 100%;

}

.edit-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.edit-title svg { width: 16px; height: 16px; stroke: var(--accent); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.edit-textarea {
    width: 100%;
    min-height: 100px;
    max-height: 200px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    line-height: 1.6;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
    -webkit-user-select: text;
    user-select: text;
}

.edit-textarea:focus { border-color: var(--accent); }
.edit-actions { display: flex; gap: 8px; margin-top: 14px; }

.edit-btn {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.edit-btn.cancel { background: var(--bg-3); color: var(--text); border: 1px solid var(--border); }
.edit-btn.save { background: var(--accent); color: #fff; }
.edit-btn:active { transform: scale(0.97); }
.edit-btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>

let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
}

function playTone(freq, duration, type = 'sine', volume = 0.06) {
    try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function playSound(type) {
    switch(type) {
        case 'tap': playTone(600, 0.05, 'sine', 0.03); break;
        case 'send':
            playTone(880, 0.08, 'sine', 0.05);
            setTimeout(() => playTone(1100, 0.1, 'sine', 0.04), 60);
            break;
        case 'receive':
            playTone(660, 0.1, 'sine', 0.05);
            setTimeout(() => playTone(880, 0.12, 'sine', 0.04), 80);
            break;
        case 'success':
            playTone(880, 0.08, 'sine', 0.05);
            setTimeout(() => playTone(1320, 0.15, 'sine', 0.05), 70);
            break;
        case 'error': playTone(300, 0.15, 'sawtooth', 0.04); break;
        case 'open': playTone(440, 0.06, 'sine', 0.03); break;
    }
}

}

// ============ Markdown ============
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function formatMessage(text) {
    if (!text) return '';

    // ===== ۱. اول کد بلاک‌ها رو جدا کن =====
    const codeBlocks = [];
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
        const idx = codeBlocks.length;
        codeBlocks.push({ lang: lang || 'code', code: code.replace(/\n$/, '') });
        return `\x00CB${idx}\x00`;
    });

    // ===== ۲. Escape HTML =====
    let html = escapeHtml(text);

    // ===== ۳. جدول‌ها (Markdown Tables) =====
    html = html.replace(/((?:^\s*\|.+\|\s*$\n?)+)/gm, (match) => {
        const lines = match.trim().split('\n').filter(l => l.trim());
        if (lines.length < 2) return match;

        const separator = lines[1];
        if (!/^\s*\|[\s\-:|]+\|\s*$/.test(separator)) return match;

        const parseRow = (line) => {
            return line.split('|').slice(1, -1).map(c => c.trim());
        };

        const headers = parseRow(lines[0]);
        const rows = lines.slice(2).map(l => parseRow(l));

        const processCell = (cell) => {
            let c = cell;
            c = c.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            c = c.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
            c = c.replace(/`([^`]+)`/g, '<code>$1</code>');
            c = c.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
            return c;
        };

        let table = '<div class="table-wrapper"><table><thead><tr>';
        headers.forEach(h => {
            table += `<th>${processCell(h)}</th>`;
        });
        table += '</tr></thead><tbody>';

        rows.forEach(row => {
            while (row.length < headers.length) row.push('');
            table += '<tr>';
            row.slice(0, headers.length).forEach(cell => {
                table += `<td>${processCell(cell)}</td>`;
            });
            table += '</tr>';
        });

        table += '</tbody></table></div>';
        return table;
    });

    // ===== ۴. Heading =====
    html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

    // ===== ۵. بولد، ایتالیک، خط‌خورده، کد اینلاین =====
    html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');
    html = html.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
    html = html.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
    html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');

    // ===== ۶. نقل قول =====
    html = html.replace(/^&gt;\s?(.+)$/gm, '<div class="quote">$1</div>');

    // ===== ۷. لیست‌ها =====
    html = html.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
    html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');

    // ===== ۸. خط‌های جدید =====
    html = html.replace(/\n{2,}/g, '<br><br>');
    html = html.replace(/\n/g, '<br>');

    // ===== ۹. لینک‌ها =====
    html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');

    // ===== ۱۰. جایگزینی کد بلاک‌ها =====
    html = html.replace(/\x00CB(\d+)\x00/g, (m, idx) => {
        const block = codeBlocks[parseInt(idx)];
        const id = 'c' + Math.random().toString(36).substr(2, 9);
        const code = escapeHtml(block.code);
        return `<div class="code-block">
    <div class="code-header">
        <span>${escapeHtml(block.lang)}</span>
        <button class="copy-btn" onclick="copyCode('${id}', this)">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            کپی
        </button>
    </div>
    <div class="code-content" id="${id}">${code}</div>
</div>`;
    });

    return html;
}

// ============ Copy ============
function copyCode(id, btn) {
    const el = document.getElementById(id);
    if (!el) return;
    copyToClipboard(el.textContent);

    if (btn) {
        const originalHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            <span>${t('copied')}</span>
        `;
        setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = originalHTML;
        }, 1800);
    }
}

function copyToClipboard(text) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
            showToast(t('copied'), 'success');
            haptic('success');
            playSound('success');
        });
    } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            showToast(t('copied'), 'success');
            haptic('success');
            playSound('success');
        } catch(e) {}
        document.body.removeChild(ta);
    }
}

    e?.stopPropagation();
    if (!conversations[id]) return;
    if (!confirm(t('messageDeleted') + '?')) return;

    delete conversations[id];

    if (currentChatId === id) {
        const remaining = Object.keys(conversations);
        if (remaining.length > 0) loadChat(remaining[0]);
        else createNewChat();
    }

    saveState();
    updateChatsList();
    showToast(t('messageDeleted'));
    haptic('warning');
    playSound('tap');
}

function pinChat(id, e) {
    e?.stopPropagation();
    if (!conversations[id]) return;
    conversations[id].pinned = !conversations[id].pinned;
    saveState();
    updateChatsList();
    showToast(conversations[id].pinned ? t('pinned') : t('unpinned'), 'success');
    haptic('light');
    playSound('tap');
}

function updateChatsList() {
    const list = document.getElementById('chatsList');
    const sorted = Object.entries(conversations).sort((a, b) => {
        if (a[1].pinned && !b[1].pinned) return -1;
        if (!a[1].pinned && b[1].pinned) return 1;
        return b[1].created_at - a[1].created_at;
    });

    if (sorted.length === 0) {
        list.innerHTML = `<div class="no-chats">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            ${t('noChats')}
        </div>`;
        return;
    }

    list.innerHTML = sorted.map(([id, chat]) => `
        <div class="chat-item ${id === currentChatId ? 'active' : ''} ${chat.pinned ? 'pinned' : ''}" onclick="loadChat('${id}');closeSidebar()">
            <div class="chat-item-icon">
                ${chat.pinned
                    ? '<svg viewBox="0 0 24 24"><path d="M12 2 L15 9 L22 10 L17 15 L18 22 L12 19 L6 22 L7 15 L2 10 L9 9 Z"/></svg>'
                    : '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'}
            </div>
            <div class="chat-item-info">
                <div class="chat-item-title">${escapeHtml(chat.title)}</div>
                <div class="chat-item-meta">${chat.messages.length} ${t('messages')}</div>
            </div>
            <div class="chat-item-actions">
    <button class="chat-action-btn" onclick="pinChat('${id}', event)" title="${chat.pinned ? 'آنپین' : 'پین'}">
        <svg viewBox="0 0 24 24" style="${chat.pinned ? 'fill: #ffb648; stroke: #ffb648;' : ''}">
            <path d="M12 2 L15 9 L22 10 L17 15 L18 22 L12 19 L6 22 L7 15 L2 10 L9 9 Z"/>
        </svg>
    </button>
    <button class="chat-action-btn danger" onclick="deleteChat('${id}', event)" title="حذف">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </button>
</div>
        </div>
    `).join('');
}

// ============ Messages ============
function addMessage(role, text, animate = true, msgIndex = null) {
    const area = document.getElementById('chatArea');
    const w = document.getElementById('welcome');
    if (w) w.remove();

    const msg = document.createElement('div');
    msg.className = 'message ' + role;
    if (!animate) msg.style.animation = 'none';

    msg.dataset.rawText = text;
    msg.dataset.role = role;
    if (msgIndex !== null) msg.dataset.msgIndex = msgIndex;

    const content = document.createElement('div');
    content.className = 'msg-content';

    const header = document.createElement('div');
    header.className = 'msg-header';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar ' + role;

    if (role === 'user') {
        if (user.photo) {
            avatar.innerHTML = `<img src="${user.photo}" alt="">`;
        } else {
            avatar.textContent = (user.name.charAt(0) || 'U').toUpperCase();
        }
    } else {
        avatar.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2 L14 9 L21 11 L14 13 L12 20 L10 13 L3 11 L10 9 Z"/></svg>';
    }

    const nameEl = document.createElement('span');
    nameEl.textContent = role === 'user' ? user.name : 'AI';

    header.appendChild(avatar);
    header.appendChild(nameEl);

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = formatMessage(text);

    content.appendChild(header);
    content.appendChild(bubble);

    if (role === 'ai') {
        const copyBtn = document.createElement('button');
        copyBtn.className = 'msg-copy-btn';
        copyBtn.innerHTML = `
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            <span>${t('copy')}</span>
        `;
        copyBtn.onclick = (e) => {
            e.stopPropagation();
            copyToClipboard(bubble.textContent);
            copyBtn.classList.add('copied');
            copyBtn.innerHTML = `
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                <span>${t('copied')}</span>
            `;
            setTimeout(() => {
                copyBtn.classList.remove('copied');
                copyBtn.innerHTML = `
                    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                    <span>${t('copy')}</span>
                `;
            }, 1800);
        };
        content.appendChild(copyBtn);
    }

    msg.appendChild(content);
    area.appendChild(msg);

    if (role === 'user') {
        msg.style.cursor = 'pointer';
        msg.addEventListener('click', (e) => {
            e.stopPropagation();
            showMsgActionMenu(msg, e);
        });
    }

    area.scrollTop = area.scrollHeight;
}

function addTyping() {
    const area = document.getElementById('chatArea');
    const w = document.getElementById('welcome');
    if (w) w.remove();

    const msg = document.createElement('div');
    msg.className = 'message ai';
    msg.id = 'typingMsg';

    const content = document.createElement('div');
    content.className = 'msg-content';

    const header = document.createElement('div');
    header.className = 'msg-header';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar ai';
    avatar.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2 L14 9 L21 11 L14 13 L12 20 L10 13 L3 11 L10 9 Z"/></svg>';

    const nameEl = document.createElement('span');
    nameEl.textContent = 'AI';

    header.appendChild(avatar);
    header.appendChild(nameEl);

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

    content.appendChild(header);
    content.appendChild(bubble);
    msg.appendChild(content);
    area.appendChild(msg);
    area.scrollTop = area.scrollHeight;
}

function removeTyping() {
    document.getElementById('typingMsg')?.remove();
}

// ============ Message Actions ============
let currentMenuTarget = null;

function showMsgActionMenu(msgElement, event) {
    const menu = document.getElementById('msgActionMenu');
    currentMenuTarget = msgElement;

    const rect = msgElement.getBoundingClientRect();
    let top = rect.bottom + 6;
    let left = rect.left;

    if (left + 160 > window.innerWidth) left = window.innerWidth - 160;
    if (top + 120 > window.innerHeight) top = rect.top - 120;

    menu.style.top = top + 'px';
    menu.style.left = left + 'px';
    menu.classList.add('show');
    haptic('light');
    playSound('tap');
}

function closeMsgActionMenu() {
    document.getElementById('msgActionMenu').classList.remove('show');
    currentMenuTarget = null;
}

function copyCurrentMessage() {
    if (!currentMenuTarget) return;
    copyToClipboard(currentMenuTarget.dataset.rawText || '');
    closeMsgActionMenu();
}

function editCurrentMessage() {
    if (!currentMenuTarget) return;

    const msgElement = currentMenuTarget;
    const rawText = msgElement.dataset.rawText || '';

    const modal = document.getElementById('editModal');
    const textarea = document.getElementById('editTextarea');
    textarea.value = rawText;
    modal.classList.add('show');
    modal.dataset.targetIndex = Array.from(msgElement.parentNode.children).indexOf(msgElement);

    closeMsgActionMenu();
    haptic('light');
    playSound('open');

    setTimeout(() => {
        textarea.focus();
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
    }, 100);
}

function closeEditModal() {
    document.getElementById('editModal').classList.remove('show');
    haptic('light');
}

async function saveEdit() {
    const modal = document.getElementById('editModal');
    const textarea = document.getElementById('editTextarea');
    const newText = textarea.value.trim();

    if (!newText) {
        showToast(t('emptyText'), 'danger');
        return;
    }

    const targetIndex = parseInt(modal.dataset.targetIndex);
    const messages = conversations[currentChatId]?.messages || [];

    if (isNaN(targetIndex) || targetIndex < 0 || targetIndex >= messages.length) {
        closeEditModal();
        return;
    }

    if (messages[targetIndex].content === newText) {
        showToast(t('noChange'), 'danger');
        closeEditModal();
        return;
    }

    if (messages[targetIndex].role !== 'user') {
        closeEditModal();
        return;
    }

    messages[targetIndex].content = newText;
    conversations[currentChatId].messages = messages.slice(0, targetIndex + 1);

    closeEditModal();
    loadChat(currentChatId);
    haptic('success');
    playSound('success');
    showToast(t('edited'), 'success');

    await regenerateAIResponse();
}

// ============ Regenerate ============
async function regenerateAIResponse() {
    if (isProcessing) return;

    const messages = conversations[currentChatId]?.messages || [];
    if (messages.length === 0) return;

    if (messages[messages.length - 1].role !== 'user') return;

    isProcessing = true;
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.classList.add('loading');
    btn.innerHTML = '<div class="spinner"></div>';

    addTyping();

    try {
        const apiMessages = [
            { role: 'system', content: buildSystemPrompt() },
            ...messages.slice(-10).map(m => ({ role: m.role, content: m.content }))
        ];

        const res = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: MODEL,
                messages: apiMessages,
                max_tokens: 800,
                temperature: 0.8
            })
        });

        removeTyping();
        if (!res.ok) throw new Error('API ' + res.status);

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || '...';

        addMessage('ai', reply);
        conversations[currentChatId].messages.push({ role: 'assistant', content: reply });
        saveState();
        updateChatsList();

        haptic('success');
        playSound('receive');
    } catch (err) {
        removeTyping();
        addMessage('ai', t('sendError'));
        haptic('error');
        playSound('error');
    } finally {
        isProcessing = false;
        btn.disabled = false;
        btn.classList.remove('loading');
        btn.innerHTML = '<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
    }
}

// ============ Limits ============
function updateLimitBadge() {
    const now = Date.now();
    messageTimestamps = messageTimestamps.filter(t => now - t < TIME_WINDOW);
    const remaining = MAX_MESSAGES - messageTimestamps.length;
    document.getElementById('limitCount').textContent = remaining;
    const badge = document.getElementById('limitBadge');
    if (remaining <= 1) badge.classList.add('warn');
    else badge.classList.remove('warn');
    saveState();
}

function checkLimit() {
    const now = Date.now();
    messageTimestamps = messageTimestamps.filter(t => now - t < TIME_WINDOW);
    if (messageTimestamps.length >= MAX_MESSAGES) {
        const waitTime = TIME_WINDOW - (now - messageTimestamps[0]);
        showLimitModal(waitTime);
        return false;
    }
    return true;
}

function showLimitModal(waitMs) {
    const modal = document.getElementById('limitModal');
    modal.classList.add('show');
    haptic('error');
    playSound('error');

    const timer = document.getElementById('timer');
    let remaining = Math.ceil(waitMs / 1000);

    const update = () => {
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        timer.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    };
    update();

    const interval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
            clearInterval(interval);
            closeModal();
            updateLimitBadge();
            showToast(t('limitReached'), 'success');
            return;
        }
        update();
    }, 1000);
}

function closeModal() {
    document.getElementById('limitModal').classList.remove('show');
}

// ============ Send ============
async function sendMessage() {
    if (isProcessing) return;

    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;
    if (!checkLimit()) return;

    if (!currentChatId || !conversations[currentChatId]) createNewChat();

    input.value = '';
    input.style.height = 'auto';

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    conversations[currentChatId].messages = [...history];

    if (conversations[currentChatId].title === t('newChatTitle')) {
        conversations[currentChatId].title = text.slice(0, 30) + (text.length > 30 ? '...' : '');
    }

    messageCount++;
    messageTimestamps.push(Date.now());
    updateLimitBadge();
    saveState();

    haptic('light');
    playSound('send');

    isProcessing = true;
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.classList.add('loading');
    btn.innerHTML = '<div class="spinner"></div>';

    addTyping();

    try {
        const messages = [
            { role: 'system', content: buildSystemPrompt() },
            ...history.slice(-10)
        ];

        const res = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: MODEL,
                messages,
                max_tokens: 800,
                temperature: 0.8
            })
        });

        removeTyping();
        if (!res.ok) throw new Error('API ' + res.status);

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || '...';

        addMessage('ai', reply);
        history.push({ role: 'assistant', content: reply });
        conversations[currentChatId].messages = [...history];
        saveState();
        updateChatsList();

        haptic('success');
        playSound('receive');
    } catch (err) {
        removeTyping();
        addMessage('ai', t('sendError'));
        haptic('error');
        playSound('error');
    } finally {
        isProcessing = false;
        btn.disabled = false;
        btn.classList.remove('loading');
        btn.innerHTML = '<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
    }
}

function sendSuggestion(text) {
    document.getElementById('input').value = text;
    sendMessage();
}

// ============ System Prompt ============
function buildSystemPrompt() {
    let prompt = `You are a smart, friendly AI assistant.
- Respond in the same language as the user (Persian/English/etc)
- Be concise and helpful
- You can use emojis but not too many
- For technical questions, answer precisely

Response format:
- Bold: **text**
- Code block: \`\`\`language ... \`\`\`
- Inline code: \`code\`
- Quote: > text
- List: - item
- Heading: ## heading
- Table: Use Markdown table format EXACTLY like this:

| Header 1 | Header 2 | Header 3 |
|----------|----------|----------|
| Cell 1   | Cell 2   | Cell 3   |
| Cell 4   | Cell 5   | Cell 6   |

IMPORTANT: Always put a blank line before and after tables. Use tables for comparisons and structured data.`;

    if (interests.length > 0) {
        prompt += `\n\nUser interests: ${interests.join(', ')}`;
    }
    prompt += `\n\nUser name: ${user.name}`;

    return prompt;
}

// ============ Profile ============
function updateProfileUI() {
    const initials = (user.name.charAt(0) || '?').toUpperCase();

    const avatar = document.getElementById('profileAvatar');
    if (user.photo) avatar.innerHTML = `<img src="${user.photo}" alt="">`;
    else avatar.innerHTML = `<span>${initials}</span>`;

    document.getElementById('profileName').textContent = user.name;
    document.getElementById('profileUsername').textContent = user.username ? '@' + user.username : '—';
    document.getElementById('profileId').textContent = 'ID: ' + user.id;
    document.getElementById('statMessages').textContent = messageCount;
    document.getElementById('statInterests').textContent = interests.length;

    const list = document.getElementById('interestsList');
    if (interests.length === 0) {
        list.innerHTML = `<div class="empty-interests">${t('noInterests')}</div>`;
    } else {
        list.innerHTML = interests.map((interest, i) => `
            <div class="interest-chip">
                <span>${escapeHtml(interest)}</span>
                <span class="x" onclick="removeInterest(${i})">&times;</span>
            </div>
        `).join('');
    }
}

function addInterest() {
    const input = document.getElementById('interestInput');
    const val = input.value.trim();
    if (!val) return;

    if (interests.length >= 15) {
        showToast(t('maxInterests'), 'danger');
        return;
    }
    if (interests.includes(val)) {
        showToast(t('alreadyAdded'), 'danger');
        return;
    }

    interests.push(val);
    input.value = '';
    updateProfileUI();
    saveState();
    haptic('success');
    playSound('success');
}

function removeInterest(i) {
    interests.splice(i, 1);
    updateProfileUI();
    saveState();
    haptic('light');
    playSound('tap');
}

// ============ Init ============
document.addEventListener('DOMContentLoaded', function() {
    tg = window.Telegram?.WebApp;

    if (tg) {
        try {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#0d0d0d');
            tg.setBackgroundColor('#0d0d0d');
            tg.enableClosingConfirmation?.();
        } catch(e) {}
    }

    // اطلاعات کاربر (فعلاً پیش‌فرض)
    user.id = 0;
    user.name = 'کاربر';
    user.username = '';
    user.photo = '';

    // بارگذاری state
    loadState();

    // اعمال تم و زبان
    setTheme(currentTheme);
    setLanguage(currentLang);

    updateProfileUI();
    updateLimitBadge();

    if (!currentChatId || !conversations[currentChatId]) {
        createNewChat();
    } else {
        loadChat(currentChatId);
    }

    setInterval(updateLimitBadge, 10000);

    // Input events
    const input = document.getElementById('input');
    if (input) {
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });

        // Enter = newline, Ctrl+Enter = send
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                sendMessage();
            }
        });
    }

    const interestInput = document.getElementById('interestInput');
    if (interestInput) {
        interestInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addInterest();
            }
        });
    }

    // Close menu on outside click
    document.addEventListener('click', (e) => {
        const menu = document.getElementById('msgActionMenu');
        if (menu && menu.classList.contains('show')) {
            if (!menu.contains(e.target)) closeMsgActionMenu();
        }
    });

    // Close edit modal on outside click
    const editModal = document.getElementById('editModal');
    if (editModal) {
        editModal.addEventListener('click', (e) => {
            if (e.target === editModal) closeEditModal();
        });
    }
});
</script>
