<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Chat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
    --bg: #0d0d0d;
    --bg-2: #161616;
    --bg-3: #1f1f1f;
    --bg-4: #2a2a2a;
    --border: #2a2a2a;
    --border-2: #333;
    --text: #ececec;
    --text-dim: #8e8e8e;
    --text-mute: #5a5a5a;
    --accent: #4d6bfe;
    --accent-2: #5b78ff;
    --accent-glow: rgba(77, 107, 254, 0.25);
    --danger: #ff5470;
    --success: #3ddc97;
    --user-bubble: #262626;
}

* {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

/* ✅ اجازه انتخاب فقط برای متن پیام */
.msg-bubble, .code-content, .interest-chip {
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;
    user-select: text;
}

.msg-bubble input, textarea {
    -webkit-user-select: text;
    user-select: text;
}

html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Vazirmatn', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
}

.app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
}

/* ===== Header ===== */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 20;
    flex-shrink: 0;
    min-height: 54px;
}

.header-left, .header-right {
    display: flex;
    align-items: center;
    gap: 6px;
}

.header-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
}

.header-logo {
    width: 26px; height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
}

.icon-btn {
    width: 36px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    position: relative;
}

.icon-btn:active {
    background: var(--bg-3);
    transform: scale(0.92);
}

.icon-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 8px;
    background: var(--bg-3);
    color: var(--text-dim);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s;
}

.badge.warn {
    background: rgba(255, 84, 112, 0.12);
    color: var(--danger);
    border-color: rgba(255, 84, 112, 0.25);
}

.badge svg {
    width: 12px;
    height: 12px;
}

/* ===== Sidebar ===== */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 90;
}

.overlay.show {
    opacity: 1;
    pointer-events: auto;
}

.sidebar {
    position: fixed;
    top: 0;
    right: 0;
    width: 82%;
    max-width: 340px;
    height: 100%;
    background: var(--bg-2);
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 100;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sidebar.open {
    transform: translateX(0);
}

.sidebar-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}

.sidebar-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
}

.new-chat-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px;
    padding: 11px 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
}

.new-chat-btn:active {
    transform: scale(0.97);
    background: var(--accent-2);
}

.new-chat-btn svg {
    width: 18px;
    height: 18px;
    stroke: #fff;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
}

.chats-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px 20px;
}

.chats-list::-webkit-scrollbar {
    width: 3px;
}

.chats-list::-webkit-scrollbar-thumb {
    background: var(--border-2);
    border-radius: 3px;
}

.chat-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.12s;
    margin-bottom: 2px;
    position: relative;
}

.chat-item:active {
    background: var(--bg-3);
}

.chat-item.active {
    background: var(--bg-3);
}

.chat-item-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--bg-3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--text-dim);
}

.chat-item.active .chat-item-icon {
    background: var(--accent);
    color: #fff;
}

.chat-item-icon svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.chat-item-info {
    flex: 1;
    min-width: 0;
}

.chat-item-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
}

.chat-item-meta {
    font-size: 11px;
    color: var(--text-mute);
}

.chat-item-actions {
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.15s;
}

.chat-item:hover .chat-item-actions,
.chat-item.active .chat-item-actions {
    opacity: 1;
}

.chat-action-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    border-radius: 7px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.12s;
}

.chat-action-btn:active {
    background: var(--bg-4);
    color: var(--text);
}

.chat-action-btn.danger:active {
    background: rgba(255, 84, 112, 0.15);
    color: var(--danger);
}

.chat-action-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.no-chats {
    text-align: center;
    color: var(--text-mute);
    font-size: 13px;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.no-chats svg {
    width: 40px;
    height: 40px;
    stroke: var(--text-mute);
    stroke-width: 1.5;
    fill: none;
    opacity: 0.6;
}

/* ===== Chat area ===== */
.chat-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 0;
    scroll-behavior: smooth;
    display: flex;
    flex-direction: column;
}

.chat-area::-webkit-scrollbar {
    width: 3px;
}

.chat-area::-webkit-scrollbar-thumb {
    background: var(--border-2);
    border-radius: 3px;
}

/* ===== Welcome ===== */
.welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 24px 24px;
    animation: fadeIn 0.4s;
    margin: auto 0;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.welcome-logo {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 0 40px var(--accent-glow);
}

.welcome-logo svg {
    width: 32px;
    height: 32px;
    stroke: #fff;
    stroke-width: 1.6;
    fill: none;
}

.welcome h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
}

.welcome p {
    color: var(--text-dim);
    font-size: 13px;
    max-width: 280px;
    line-height: 1.7;
}

.suggestions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 28px;
    width: 100%;
    max-width: 340px;
}

.suggestion {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 13px;
    text-align: right;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
}

.suggestion:active {
    transform: scale(0.98);
    background: var(--bg-3);
    border-color: var(--accent);
}

.suggestion svg {
    width: 16px;
    height: 16px;
    stroke: var(--accent);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
}

/* ===== Message ===== */
.message {
    display: flex;
    padding: 0 16px;
    margin-bottom: 18px;
    animation: msgIn 0.3s ease-out;
    max-width: 100%;
    position: relative;
}

@keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ✅ کاربر راست، AI چپ */
.message.user {
    justify-content: flex-start;
    flex-direction: row;
}

.message.ai {
    justify-content: flex-end;
    flex-direction: row;
}

.msg-content {
    display: flex;
    flex-direction: column;
    max-width: 88%;
}

.message.user .msg-content {
    align-items: flex-start;
}

.message.ai .msg-content {
    align-items: flex-end;
}

.msg-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
}

.message.ai .msg-header {
    flex-direction: row-reverse;
}

.msg-avatar {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
}

.msg-avatar.ai {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
}

.msg-avatar.ai svg {
    width: 12px;
    height: 12px;
    stroke: #fff;
    stroke-width: 2;
    fill: none;
}

.msg-avatar.user {
    background: var(--bg-3);
    color: var(--accent);
    font-size: 10px;
    font-weight: 700;
}

.msg-avatar.user img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.msg-bubble {
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.75;
    word-wrap: break-word;
    overflow-wrap: break-word;
    max-width: 100%;
    position: relative;
}

.message.user .msg-bubble {
    background: var(--user-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 5px;
    color: var(--text);
}

.message.ai .msg-bubble {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-top-right-radius: 5px;
    color: var(--text);
}

/* ===== Copy button for AI messages ===== */
.msg-copy-btn {
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
    align-self: flex-start;
}

.message.ai .msg-copy-btn {
    align-self: flex-end;
}

.msg-copy-btn:active {
    background: var(--bg-3);
    color: var(--text);
    transform: scale(0.96);
}

.msg-copy-btn svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.msg-copy-btn.copied {
    color: var(--success);
    border-color: rgba(61, 220, 151, 0.4);
}

/* ===== Markdown ===== */
.msg-bubble strong {
    font-weight: 700;
    color: #fff;
}

.msg-bubble em {
    font-style: italic;
    color: var(--accent-2);
}

.msg-bubble del {
    text-decoration: line-through;
    opacity: 0.5;
}

.msg-bubble code {
    background: var(--bg-3);
    padding: 2px 6px;
    border-radius: 5px;
    font-family: 'JetBrains Mono', 'Courier New', Consolas, monospace;
    font-size: 13px;
    direction: ltr;
    display: inline-block;
    color: #ffb27a;
    border: 1px solid var(--border);
}

.code-block {
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 12px 0;
    overflow: hidden;
    direction: ltr;
    text-align: left;
    max-width: 100%;
}

.code-header {
    background: var(--bg-3);
    padding: 8px 14px;
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-weight: 600;
}

.copy-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 6px;
    transition: all 0.15s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: 500;
}

.copy-btn:active {
    background: var(--bg-4);
    color: var(--text);
}

.copy-btn svg {
    width: 11px;
    height: 11px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.code-content {
    padding: 14px;
    overflow-x: auto;
    font-family: 'JetBrains Mono', 'Courier New', Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.7;
    color: #d4d4d4;
    white-space: pre;
}

.code-content::-webkit-scrollbar {
    height: 4px;
}

.code-content::-webkit-scrollbar-thumb {
    background: var(--border-2);
    border-radius: 4px;
}

.quote {
    border-right: 3px solid var(--accent);
    padding: 8px 14px;
    margin: 10px 0;
    background: rgba(77, 107, 254, 0.06);
    border-radius: 6px;
    font-size: 14px;
    color: var(--text-dim);
}

.msg-bubble ul, .msg-bubble ol {
    margin: 10px 0;
    padding-right: 24px;
}

.msg-bubble li {
    margin: 6px 0;
    line-height: 1.7;
}

.msg-bubble a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(77, 107, 254, 0.3);
}

.msg-bubble h1, .msg-bubble h2, .msg-bubble h3 {
    color: #fff;
    margin: 12px 0 8px;
    font-weight: 700;
    line-height: 1.4;
}

.msg-bubble h1 { font-size: 18px; }
.msg-bubble h2 { font-size: 16px; }
.msg-bubble h3 { font-size: 15px; }

/* ===== Typing ===== */
.typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
}

.typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: typing 1.4s ease-in-out infinite;
    opacity: 0.6;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
}

/* ===== Input area ===== */
.input-area {
    padding: 10px 14px 16px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
}

.input-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 6px 6px 6px 14px;
    transition: border-color 0.2s;
}

.input-wrapper:focus-within {
    border-color: var(--accent);
}

#input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    padding: 8px 0;
    -webkit-user-select: text;
    user-select: text;
}

#input::placeholder {
    color: var(--text-mute);
}

.send-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
}

.send-btn:active {
    transform: scale(0.9);
}

.send-btn:disabled {
    background: var(--bg-4);
    color: var(--text-mute);
    cursor: not-allowed;
}

.send-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.send-btn.loading svg {
    display: none;
}

.spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ===== Profile ===== */
.profile-avatar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 24px;
}

.profile-avatar {
    width: 88px;
    height: 88px;
    border-radius: 24px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: 0 0 30px var(--accent-glow);
}

.profile-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
}

.profile-sub {
    font-size: 12px;
    color: var(--text-dim);
}

.profile-id {
    font-size: 11px;
    color: var(--text-mute);
    margin-top: 4px;
    direction: ltr;
    font-family: 'JetBrains Mono', monospace;
}

.stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 16px;
    margin-bottom: 16px;
}

.stat-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
}

.stat-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
}

.stat-label {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
}

/* ===== Link buttons ===== */
.links-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 16px;
    margin-bottom: 16px;
}

.link-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 18px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);

// ============ Config ============

// ============ Sound ============
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
}

function playTone(freq, duration, type = 'sine', volume = 0.06) {
    try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function playSound(type) {
    switch(type) {
        case 'tap': playTone(600, 0.05, 'sine', 0.03); break;
        case 'send':
            playTone(880, 0.08, 'sine', 0.05);
            setTimeout(() => playTone(1100, 0.1, 'sine', 0.04), 60);
            break;
        case 'receive':
            playTone(660, 0.1, 'sine', 0.05);
            setTimeout(() => playTone(880, 0.12, 'sine', 0.04), 80);
            break;
        case 'success':
            playTone(880, 0.08, 'sine', 0.05);
            setTimeout(() => playTone(1320, 0.15, 'sine', 0.05), 70);
            break;
        case 'error': playTone(300, 0.15, 'sawtooth', 0.04); break;
        case 'open': playTone(440, 0.06, 'sine', 0.03); break;
    }
}

function haptic(type = 'light') {

            light: () => tg.HapticFeedback.impactOccurred('light'),
            medium: () => tg.HapticFeedback.impactOccurred('medium'),
            heavy: () => tg.HapticFeedback.impactOccurred('heavy'),
            success: () => tg.HapticFeedback.notificationOccurred('success'),

            warning: () => tg.HapticFeedback.notificationOccurred('warning'),

// ============ Helpers ============
function showToast(text, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.className = 'toast show ' + type;
    setTimeout(() => toast.className = 'toast ' + type, 2200);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ============ Markdown ============
function formatMessage(text) {
    if (!text) return '';

    const codeBlocks = [];
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
        const idx = codeBlocks.length;
        codeBlocks.push({ lang: lang || 'code', code: code.replace(/\n$/, '') });
        return `\x00CB${idx}\x00`;
    });

    let html = escapeHtml(text);

    html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

    html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');
    html = html.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
    html = html.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
    html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');

    html = html.replace(/^&gt;\s?(.+)$/gm, '<div class="quote">$1</div>');

    html = html.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
    html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');

    html = html.replace(/\n{2,}/g, '<br><br>');
    html = html.replace(/\n/g, '<br>');
    html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');

    html = html.replace(/\x00CB(\d+)\x00/g, (m, idx) => {
        const block = codeBlocks[parseInt(idx)];
        const id = 'c' + Math.random().toString(36).substr(2, 9);
        const code = escapeHtml(block.code);
        return `<div class="code-block">
            <div class="code-header">
                <span>${escapeHtml(block.lang)}</span>
                <button class="copy-btn" onclick="copyCode('${id}')">
                    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                    کپی
                </button>
            </div>
            <div class="code-content" id="${id}">${code}</div>
        </div>`;
    });

    return html;
}

function copyCode(id) {
    const el = document.getElementById(id);
    if (!el) return;
    copyToClipboard(el.textContent);
}

function copyToClipboard(text) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
            showToast('کپی شد', 'success');
            haptic('success');
            playSound('success');
        });
    } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            showToast('کپی شد', 'success');
            haptic('success');
            playSound('success');
        } catch(e) {}
        document.body.removeChild(ta);
    }
}

    loadChat(id);
    closeSidebar();
    haptic('medium');
    playSound('success');
}

function loadChat(id) {
    if (!conversations[id]) return;
    currentChatId = id;
    history = [...conversations[id].messages];
    saveState();

    const area = document.getElementById('chatArea');
    area.innerHTML = '';

    if (history.length === 0) {
        area.innerHTML = welcomeHTML();
    } else {
        history.forEach(msg => addMessage(msg.role === 'user' ? 'user' : 'ai', msg.content, false));
    }

    updateChatsList();
    haptic('select');
}

function deleteChat(id, e) {
    e?.stopPropagation();
    if (!conversations[id]) return;
    if (!confirm('این چت حذف بشه؟')) return;

    delete conversations[id];

    if (currentChatId === id) {
        const remaining = Object.keys(conversations);
        if (remaining.length > 0) loadChat(remaining[0]);
        else createNewChat();
    }

    saveState();
    updateChatsList();
    showToast('چت حذف شد');
    haptic('warning');
    playSound('tap');
}

function pinChat(id, e) {
    e?.stopPropagation();
    if (!conversations[id]) return;
    conversations[id].pinned = !conversations[id].pinned;
    saveState();
    updateChatsList();
    showToast(conversations[id].pinned ? 'پین شد' : 'آنپین شد', 'success');
    haptic('light');
    playSound('tap');
}

function updateChatsList() {
    const list = document.getElementById('chatsList');
    const sorted = Object.entries(conversations).sort((a, b) => {
        if (a[1].pinned && !b[1].pinned) return -1;
        if (!a[1].pinned && b[1].pinned) return 1;
        return b[1].created_at - a[1].created_at;
    });

    if (sorted.length === 0) {
        list.innerHTML = `<div class="no-chats">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            هنوز چتی نداری
        </div>`;
        return;
    }

    list.innerHTML = sorted.map(([id, chat]) => `
        <div class="chat-item ${id === currentChatId ? 'active' : ''}" onclick="loadChat('${id}');closeSidebar()">
            <div class="chat-item-icon">
                ${chat.pinned
                    ? '<svg viewBox="0 0 24 24"><path d="M12 2 L15 9 L22 10 L17 15 L18 22 L12 19 L6 22 L7 15 L2 10 L9 9 Z"/></svg>'
                    : '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'}
            </div>
            <div class="chat-item-info">
                <div class="chat-item-title">${escapeHtml(chat.title)}</div>
                <div class="chat-item-meta">${chat.messages.length} پیام</div>
            </div>
            <div class="chat-item-actions">
                <button class="chat-action-btn" onclick="pinChat('${id}', event)">
                    <svg viewBox="0 0 24 24"><path d="M12 2 L15 9 L22 10 L17 15 L18 22 L12 19 L6 22 L7 15 L2 10 L9 9 Z"/></svg>
                </button>
                <button class="chat-action-btn danger" onclick="deleteChat('${id}', event)">
                    <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>
        </div>
    `).join('');
}

// ============ Welcome ============
function welcomeHTML() {
    const name = user.name.split(' ')[0] || '';
    return `<div class="welcome" id="welcome">
        <div class="welcome-logo">
            <svg viewBox="0 0 24 24"><path d="M12 2 L14 9 L21 11 L14 13 L12 20 L10 13 L3 11 L10 9 Z"/></svg>
        </div>
        <h1>سلام ${escapeHtml(name)}</h1>
        <p>چطور میتونم کمکت کنم؟</p>
        <div class="suggestions">
            <button class="suggestion" onclick="sendSuggestion('یه جوک بگو')">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                یه جوک بگو
            </button>
            <button class="suggestion" onclick="sendSuggestion('بر اساس علایقم یه پیشنهاد بده')">
                <svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V18h6v-1.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg>
                بر اساس علایقم پیشنهاد بده
            </button>
            <button class="suggestion" onclick="sendSuggestion('یه کد پایتون برای شروع بده')">
                <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                یه کد پایتون بده
            </button>
        </div>
    </div>`;
}

// ============ Messages ============
function addMessage(role, text, animate = true) {
    const area = document.getElementById('chatArea');
    const w = document.getElementById('welcome');
    if (w) w.remove();

    const msg = document.createElement('div');
    msg.className = 'message ' + role;
    if (!animate) msg.style.animation = 'none';

    const content = document.createElement('div');
    content.className = 'msg-content';

    const header = document.createElement('div');
    header.className = 'msg-header';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar ' + role;

    if (role === 'user') {
        if (user.photo) {
            avatar.innerHTML = `<img src="${user.photo}" alt="">`;
        } else {
            avatar.textContent = (user.name.charAt(0) || 'U').toUpperCase();
        }
    } else {
        avatar.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2 L14 9 L21 11 L14 13 L12 20 L10 13 L3 11 L10 9 Z"/></svg>';
    }

    const nameEl = document.createElement('span');
    nameEl.textContent = role === 'user' ? user.name : 'AI';

    header.appendChild(avatar);
    header.appendChild(nameEl);

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = formatMessage(text);

    content.appendChild(header);
    content.appendChild(bubble);

    // ✅ دکمه کپی فقط برای AI
    if (role === 'ai') {
        const copyBtn = document.createElement('button');
        copyBtn.className = 'msg-copy-btn';
        copyBtn.innerHTML = `
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            کپی
        `;
        copyBtn.onclick = (e) => {
            e.stopPropagation();
            const rawText = bubble.textContent;
            copyToClipboard(rawText);
            copyBtn.classList.add('copied');
            copyBtn.innerHTML = `
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                کپی شد
            `;
            setTimeout(() => {
                copyBtn.classList.remove('copied');
                copyBtn.innerHTML = `
                    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                    کپی
                `;
            }, 1800);
        };
        content.appendChild(copyBtn);
    }

    msg.appendChild(content);
    area.appendChild(msg);
    area.scrollTop = area.scrollHeight;
}

function addTyping() {
    const area = document.getElementById('chatArea');
    const w = document.getElementById('welcome');
    if (w) w.remove();

    const msg = document.createElement('div');
    msg.className = 'message ai';
    msg.id = 'typingMsg';

    const content = document.createElement('div');
    content.className = 'msg-content';

    const header = document.createElement('div');
    header.className = 'msg-header';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar ai';
    avatar.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2 L14 9 L21 11 L14 13 L12 20 L10 13 L3 11 L10 9 Z"/></svg>';

    const nameEl = document.createElement('span');
    nameEl.textContent = 'AI';

    header.appendChild(avatar);
    header.appendChild(nameEl);

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

    content.appendChild(header);
    content.appendChild(bubble);
    msg.appendChild(content);
    area.appendChild(msg);
    area.scrollTop = area.scrollHeight;
}

function removeTyping() {
    document.getElementById('typingMsg')?.remove();
}

// ============ Limits ============
function updateLimitBadge() {
    const now = Date.now();
    messageTimestamps = messageTimestamps.filter(t => now - t < TIME_WINDOW);
    const remaining = MAX_MESSAGES - messageTimestamps.length;

    document.getElementById('limitCount').textContent = remaining;

    const badge = document.getElementById('limitBadge');
    if (remaining <= 1) badge.classList.add('warn');
    else badge.classList.remove('warn');

    saveState();
}

function checkLimit() {
    const now = Date.now();
    messageTimestamps = messageTimestamps.filter(t => now - t < TIME_WINDOW);

    if (messageTimestamps.length >= MAX_MESSAGES) {
        const waitTime = TIME_WINDOW - (now - messageTimestamps[0]);
        showLimitModal(waitTime);
        return false;
    }
    return true;
}

function showLimitModal(waitMs) {
    const modal = document.getElementById('limitModal');
    modal.classList.add('show');
    haptic('error');
    playSound('error');

    const timer = document.getElementById('timer');
    let remaining = Math.ceil(waitMs / 1000);

    const update = () => {
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        timer.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    };
    update();

    const interval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
            clearInterval(interval);
            closeModal();
            updateLimitBadge();
            showToast('میتونید دوباره پیام بدید', 'success');
            return;
        }
        update();
    }, 1000);
}

function closeModal() {
    document.getElementById('limitModal').classList.remove('show');
}

// ============ Send ============
async function sendMessage() {
    if (isProcessing) return;

    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;
    if (!checkLimit()) return;

    if (!currentChatId || !conversations[currentChatId]) createNewChat();

    input.value = '';
    input.style.height = 'auto';

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    conversations[currentChatId].messages = [...history];

    if (conversations[currentChatId].title === 'چت جدید') {
        conversations[currentChatId].title = text.slice(0, 30) + (text.length > 30 ? '...' : '');
    }

    messageCount++;
    messageTimestamps.push(Date.now());
    updateLimitBadge();
    saveState();

    haptic('light');
    playSound('send');

    isProcessing = true;
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.classList.add('loading');
    btn.innerHTML = '<div class="spinner"></div>';

    addTyping();

    try {
        const messages = [
            { role: 'system', content: buildSystemPrompt() },
            ...history.slice(-10)
        ];

        const res = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: MODEL,
                messages,
                max_tokens: 800,
                temperature: 0.8
            })
        });

        removeTyping();

        if (!res.ok) throw new Error('API ' + res.status);

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || 'پاسخی دریافت نشد';

        addMessage('ai', reply);
        history.push({ role: 'assistant', content: reply });
        conversations[currentChatId].messages = [...history];
        saveState();
        updateChatsList();

        haptic('success');
        playSound('receive');

    } catch (err) {
        removeTyping();
        addMessage('ai', 'خطا در ارتباط با سرور. دوباره تلاش کنید.');
        haptic('error');
        playSound('error');
        console.error(err);
    } finally {
        isProcessing = false;
        btn.disabled = false;
        btn.classList.remove('loading');
        btn.innerHTML = '<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
    }
}

function sendSuggestion(text) {
    document.getElementById('input').value = text;
    sendMessage();
}

// ============ Profile ============
function updateProfileUI() {
    const initials = (user.name.charAt(0) || '?').toUpperCase();

    const avatar = document.getElementById('profileAvatar');
    if (user.photo) {
        avatar.innerHTML = `<img src="${user.photo}" alt="">`;
    } else {
        avatar.innerHTML = `<span>${initials}</span>`;
    }

    document.getElementById('profileName').textContent = user.name;
    document.getElementById('profileUsername').textContent = user.username ? '@' + user.username : 'بدون یوزرنیم';
    document.getElementById('profileId').textContent = 'ID: ' + user.id;
    document.getElementById('statMessages').textContent = messageCount;
    document.getElementById('statInterests').textContent = interests.length;

    const list = document.getElementById('interestsList');
    if (interests.length === 0) {
        list.innerHTML = '<div class="empty-interests">هنوز علاقه‌ای ثبت نکردی</div>';
    } else {
        list.innerHTML = interests.map((interest, i) => `
            <div class="interest-chip">
                <span>${escapeHtml(interest)}</span>
                <span class="x" onclick="removeInterest(${i})">&times;</span>
            </div>
        `).join('');
    }
}

function addInterest() {
    const input = document.getElementById('interestInput');
    const val = input.value.trim();
    if (!val) return;

    if (interests.length >= 15) {
        showToast('حداکثر ۱۵ علاقه', 'danger');
        haptic('error');
        return;
    }
    if (interests.includes(val)) {
        showToast('قبلا ثبت شده', 'danger');
        haptic('error');
        return;
    }

    interests.push(val);
    input.value = '';
    updateProfileUI();
    saveState();
    haptic('success');
    playSound('success');
}

function removeInterest(i) {
    interests.splice(i, 1);
    updateProfileUI();
    saveState();
    haptic('light');
    playSound('tap');
}

// ============ Input ============
const input = document.getElementById('input');
input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

document.getElementById('interestInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        addInterest();
    }
});

// ============ Boot ============
loadState();
updateProfileUI();
updateLimitBadge();

if (!currentChatId || !conversations[currentChatId]) {
    createNewChat();
} else {
    loadChat(currentChatId);
}

setInterval(updateLimitBadge, 10000);
</script>
